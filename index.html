<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BORUSAN OTOMOTİV — Premium CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --gold-dim: rgba(201,168,76,0.15);
  }

  body.theme-dark {
    --carbon: #0a0a0f;
    --panel: #11111a;
    --panel2: #16161f;
    --border: rgba(201,168,76,0.2);
    --text: #d4d4e0;
    --text-dim: #6b6b80;
  }

  body.theme-light {
    --carbon: #f8f7f4;
    --panel: #ffffff;
    --panel2: #fafaf8;
    --border: rgba(201,168,76,0.25);
    --text: #2c2c3a;
    --text-dim: #6b6b80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--carbon);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    transition: background-color 0.5s ease;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .crm-input {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201,168,76,0.15);
    color: var(--text);
    padding: 10px 14px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    outline: none;
    border-radius: 2px;
  }

  .crm-input:focus {
    border-color: var(--gold);
    background: rgba(201,168,76,0.04);
  }

  .btn-gold {
    background: linear-gradient(135deg, var(--gold), #a8823a);
    color: #0a0a0f;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    border-radius: 2px;
  }

  .btn-gold:hover { background: linear-gradient(135deg, var(--gold-light), var(--gold)); }

  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 10px 16px;
    border: 1px solid var(--border);
    cursor: pointer;
    border-radius: 2px;
  }

  .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

  .display-font { font-family: 'Bebas Neue', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDUf2hQIzOoTNd3bGFLdHZvd_KBtFRj7j8",
  authDomain: "borusan-crm.firebaseapp.com",
  projectId: "borusan-crm",
  storageBucket: "borusan-crm.firebasestorage.app",
  messagingSenderId: "488490232677",
  appId: "1:488490232677:web:fbd860d63c3121a1bc8f8c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.firebaseDb = db;
window.firebaseModules = { collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp, query, orderBy };
</script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function BorusanCRM() {
  const [customers, setCustomers] = useState([]);
  const [pdfUrl, setPdfUrl] = useState(localStorage.getItem('bmw_pdf_url') || '');
  const [pdfLinkInput, setPdfLinkInput] = useState('');

  const db = window.firebaseDb;
  const { collection, onSnapshot, query, orderBy, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } = window.firebaseModules;

  // Tema
  useEffect(() => {
    const hour = new Date().getHours();
    const theme = (hour >= 6 && hour < 18) ? 'light' : 'dark';
    document.body.className = `theme-${theme}`;
  }, []);

  // Müşterileri yükle
  useEffect(() => {
    if (!db) return;
    const q = query(collection(db, 'customers'), orderBy('createdAt', 'desc'));
    const unsub = onSnapshot(q, snap => {
      setCustomers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, [db]);

  // PDF kaydet
  const savePdfUrl = () => {
    if (!pdfLinkInput.trim()) {
      alert('⚠️ Lütfen bir link girin!');
      return;
    }
    
    let finalUrl = pdfLinkInput.trim();
    
    if (finalUrl.includes('drive.google.com')) {
      const match = finalUrl.match(/\/d\/([^\/]+)/);
      if (match) {
        const fileId = match[1];
        finalUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;
      }
    }
    
    localStorage.setItem('bmw_pdf_url', finalUrl);
    setPdfUrl(finalUrl);
    setPdfLinkInput('');
    alert('✅ PDF linki kaydedildi!');
  };

  // PDF sil
  const deletePdfUrl = () => {
    if (window.confirm('PDF linkini silmek istediğinizden emin misiniz?')) {
      localStorage.removeItem('bmw_pdf_url');
      setPdfUrl('');
      alert('✅ PDF linki silindi!');
    }
  };

  const STATUS_OPTIONS = ['Teklif Gönderildi', 'Finansal Değerlendirme', 'Sözleşme/DBS Bekleniyor', 'Teslimat'];

  return (
    <div style={{ padding: '16px', maxWidth: '1600px', margin: '0 auto' }}>
      
      {/* HEADER */}
      <div style={{ marginBottom: '24px' }}>
        <div className="display-font" style={{ fontSize: '40px', color: 'var(--gold)', letterSpacing: '0.12em', marginBottom: '8px' }}>
          BORUSAN PREMIUM CRM
        </div>
        <div className="mono" style={{ fontSize: '11px', color: 'var(--text-dim)' }}>
          {customers.length} MÜŞTERİ • REAL-TIME SYNC
        </div>
      </div>

      {/* PDF BÖLÜMÜ */}
      <div className="panel">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
          <div className="display-font" style={{ fontSize: '20px', color: 'var(--gold)' }}>
            📄 BMW 0 KM TEKLİF
          </div>
          {pdfUrl && (
            <div style={{ display: 'flex', gap: '8px' }}>
              <a href={pdfUrl} target="_blank" rel="noopener noreferrer">
                <button className="btn-gold">İNDİR</button>
              </a>
              <button className="btn-ghost" onClick={deletePdfUrl}>SİL</button>
            </div>
          )}
        </div>

        {pdfUrl ? (
          <div style={{ background: 'var(--panel2)', padding: '20px', borderRadius: '2px', border: '1px solid var(--border)' }}>
            <div style={{ fontWeight: 600, color: 'var(--gold)', marginBottom: '12px' }}>✓ PDF Linki Aktif</div>
            <div className="mono" style={{ fontSize: '11px', color: 'var(--text-dim)', marginBottom: '16px', wordBreak: 'break-all', background: 'rgba(0,0,0,0.2)', padding: '8px', borderRadius: '2px' }}>
              {pdfUrl}
            </div>
            <div style={{ display: 'flex', gap: '8px' }}>
              <input
                className="crm-input"
                type="text"
                value={pdfLinkInput}
                onChange={e => setPdfLinkInput(e.target.value)}
                placeholder="Yeni Google Drive linki..."
                style={{ flex: 1 }}
              />
              <button className="btn-gold" onClick={savePdfUrl}>GÜNCELLE</button>
            </div>
          </div>
        ) : (
          <div style={{ background: 'var(--panel2)', padding: '24px', borderRadius: '2px', border: '1px solid var(--border)' }}>
            <div className="mono" style={{ fontSize: '11px', color: 'var(--gold)', marginBottom: '12px', fontWeight: 600 }}>
              📝 GOOGLE DRIVE KULLANIMI:
            </div>
            <ol style={{ fontSize: '13px', color: 'var(--text-dim)', marginBottom: '16px', paddingLeft: '20px', lineHeight: 1.8 }}>
              <li>PDF'i Google Drive'a yükle</li>
              <li>Sağ tıkla → <strong style={{ color: 'var(--gold)' }}>Share</strong> → <strong style={{ color: 'var(--gold)' }}>Anyone with the link</strong></li>
              <li><strong style={{ color: 'var(--gold)' }}>Copy link</strong> → Aşağıya yapıştır</li>
            </ol>
            <div style={{ display: 'flex', gap: '8px' }}>
              <input
                className="crm-input"
                type="text"
                value={pdfLinkInput}
                onChange={e => setPdfLinkInput(e.target.value)}
                placeholder="https://drive.google.com/file/d/XXXXX/view"
                style={{ flex: 1 }}
              />
              <button className="btn-gold" onClick={savePdfUrl}>KAYDET</button>
            </div>
          </div>
        )}
      </div>

      {/* MÜŞTERİ LİSTESİ */}
      <div className="panel">
        <div className="display-font" style={{ fontSize: '20px', color: 'var(--gold)', marginBottom: '16px' }}>
          👥 MÜŞTERİ LİSTESİ
        </div>
        
        {customers.length === 0 ? (
          <div style={{ textAlign: 'center', padding: '40px', color: 'var(--text-dim)' }}>
            <div className="display-font" style={{ fontSize: '24px', marginBottom: '8px' }}>Henüz müşteri yok</div>
            <div className="mono" style={{ fontSize: '11px' }}>Müşteri eklemek için yukarıdaki butonu kullanın</div>
          </div>
        ) : (
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse' }}>
              <thead>
                <tr>
                  <th style={{ padding: '12px', textAlign: 'left', borderBottom: '1px solid var(--border)', color: 'var(--gold)', fontSize: '11px' }}>#</th>
                  <th style={{ padding: '12px', textAlign: 'left', borderBottom: '1px solid var(--border)', color: 'var(--gold)', fontSize: '11px' }}>MÜŞTERİ</th>
                  <th style={{ padding: '12px', textAlign: 'left', borderBottom: '1px solid var(--border)', color: 'var(--gold)', fontSize: '11px' }}>TELEFON</th>
                  <th style={{ padding: '12px', textAlign: 'left', borderBottom: '1px solid var(--border)', color: 'var(--gold)', fontSize: '11px' }}>ARAÇ</th>
                  <th style={{ padding: '12px', textAlign: 'left', borderBottom: '1px solid var(--border)', color: 'var(--gold)', fontSize: '11px' }}>DURUM</th>
                </tr>
              </thead>
              <tbody>
                {customers.map((c, i) => (
                  <tr key={c.id} style={{ borderBottom: '1px solid rgba(255,255,255,0.04)' }}>
                    <td style={{ padding: '14px' }}>{i + 1}</td>
                    <td style={{ padding: '14px', fontWeight: 700 }}>{c.name}</td>
                    <td style={{ padding: '14px' }} className="mono">{c.phone}</td>
                    <td style={{ padding: '14px' }}>{c.carModel}</td>
                    <td style={{ padding: '14px' }}>
                      <span style={{ padding: '4px 10px', background: 'rgba(201,168,76,0.12)', color: 'var(--gold)', borderRadius: '2px', fontSize: '10px' }}>
                        {c.status}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BorusanCRM />);
</script>
</body>
</html>
