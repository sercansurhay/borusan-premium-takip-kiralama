<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --gold-dim: rgba(201,168,76,0.15);
    --carbon: #0a0a0f;
    --panel: #11111a;
    --panel2: #16161f;
    --border: rgba(201,168,76,0.2);
    --text: #d4d4e0;
    --text-dim: #6b6b80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--carbon);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow top-left */
  body::after {
    content: '';
    position: fixed;
    top: -200px;
    left: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  #root { position: relative; z-index: 1; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--panel); }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

  /* Panel */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }

  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.6;
  }

  /* Gold line accent */
  .gold-line {
    display: inline-block;
    width: 3px;
    height: 100%;
    background: var(--gold);
    position: absolute;
    left: 0; top: 0;
  }

  /* Heading */
  .display-font { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* Gold text */
  .gold { color: var(--gold); }
  .gold-dim { color: var(--text-dim); }

  /* Input */
  .crm-input {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201,168,76,0.15);
    color: var(--text);
    padding: 10px 14px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 500;
    outline: none;
    transition: all 0.2s;
    border-radius: 2px;
  }

  .crm-input:focus {
    border-color: var(--gold);
    background: rgba(201,168,76,0.04);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
  }

  .crm-input::placeholder { color: var(--text-dim); font-size: 13px; }

  select.crm-input option { background: #1a1a25; color: var(--text); }

  /* Button */
  .btn-gold {
    background: linear-gradient(135deg, var(--gold), #a8823a);
    color: #0a0a0f;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 2px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-gold:hover { background: linear-gradient(135deg, var(--gold-light), var(--gold)); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(201,168,76,0.3); }
  .btn-gold:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 16px;
    border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 2px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-ghost:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
  .btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-danger {
    background: transparent;
    color: #ef4444;
    border: 1px solid rgba(239,68,68,0.2);
    padding: 8px 10px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
  }
  .btn-danger:hover { background: rgba(239,68,68,0.1); border-color: #ef4444; }

  .btn-edit {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid rgba(255,255,255,0.06);
    padding: 8px 10px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
  }
  .btn-edit:hover { color: var(--gold); border-color: var(--gold); background: var(--gold-dim); }

  /* Status badges */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    border-radius: 2px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .badge-teklif { background: rgba(139,92,246,0.12); color: #a78bfa; border: 1px solid rgba(139,92,246,0.25); }
  .badge-finansal { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }
  .badge-sozlesme { background: rgba(249,115,22,0.12); color: #fb923c; border: 1px solid rgba(249,115,22,0.25); }
  .badge-teslimat { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }

  /* Stat card */
  .stat-card {
    background: var(--panel2);
    border: 1px solid var(--border);
    padding: 20px 24px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
    border-radius: 2px;
  }

  .stat-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    transform: scaleX(0);
    transition: transform 0.3s;
  }

  .stat-card:hover { border-color: var(--gold); background: rgba(201,168,76,0.04); transform: translateY(-2px); }
  .stat-card:hover::after { transform: scaleX(1); }

  /* Table */
  .crm-table { width: 100%; border-collapse: collapse; }
  .crm-table th {
    background: rgba(201,168,76,0.05);
    color: var(--gold);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  .crm-table td {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
  }

  .crm-table tr:hover td { background: rgba(201,168,76,0.03); }
  .crm-table tr.overdue td { background: rgba(239,68,68,0.03); }
  .crm-table tr.overdue:hover td { background: rgba(239,68,68,0.06); }

  /* Filter inputs in table header */
  .th-filter {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201,168,76,0.1);
    color: var(--text);
    padding: 6px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    outline: none;
    transition: all 0.2s;
    border-radius: 2px;
    margin-top: 8px;
  }

  .th-filter:focus { border-color: var(--gold); background: rgba(201,168,76,0.04); }
  .th-filter::placeholder { color: var(--text-dim); }
  select.th-filter option { background: #1a1a25; }

  /* Overdue badge */
  .badge-overdue {
    display: inline-flex;
    align-items: center;
    padding: 2px 6px;
    background: rgba(239,68,68,0.15);
    color: #f87171;
    border: 1px solid rgba(239,68,68,0.3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    border-radius: 2px;
    animation: blink 2s infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }

  /* Sort button */
  .sort-btn {
    background: none;
    border: none;
    color: inherit;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    color: var(--gold);
    transition: color 0.2s;
  }
  .sort-btn:hover { color: var(--gold-light); }
  .sort-btn .sort-arrow { font-size: 8px; opacity: 0.5; }
  .sort-btn.active .sort-arrow { opacity: 1; color: var(--gold-light); }

  /* Animations */
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .animate-fade-up { animation: fadeUp 0.5s ease forwards; }
  .animate-pulse { animation: pulse 2s infinite; }

  /* Warning banner */
  .warning-banner {
    background: linear-gradient(135deg, rgba(239,68,68,0.08), rgba(239,68,68,0.04));
    border: 1px solid rgba(239,68,68,0.3);
    border-left: 3px solid #ef4444;
    padding: 16px 20px;
    border-radius: 2px;
  }

  /* Divider */
  .gold-divider {
    height: 1px;
    background: linear-gradient(90deg, var(--gold), transparent);
    margin: 24px 0;
    opacity: 0.3;
  }

  /* Number index */
  .row-index {
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    border-radius: 2px;
  }

  .row-index.overdue {
    border-color: rgba(239,68,68,0.4);
    color: #f87171;
  }

  /* Mobile responsive */
  @media (max-width: 768px) {
    .hide-mobile { display: none !important; }
    .crm-table th, .crm-table td { padding: 10px 12px; }
  }

  /* Loading dot */
  .dot-live {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulse 2s infinite;
    display: inline-block;
  }
</style>

const STATUS_MAP = {
  'Teklif Gönderildi':       { badge: 'badge-teklif',   dot: '#a78bfa' },
  'Finansal Değerlendirme':  { badge: 'badge-finansal', dot: '#fbbf24' },
  'Sözleşme/DBS Bekleniyor': { badge: 'badge-sozlesme', dot: '#fb923c' },
  'Teslimat':                { badge: 'badge-teslimat', dot: '#4ade80' },
};

const STATUS_OPTIONS = Object.keys(STATUS_MAP);

function getDate(ts) {
  if (!ts) return null;
  if (typeof ts.toDate === 'function') return ts.toDate();
  if (ts.seconds) return new Date(ts.seconds * 1000);
  return new Date(ts);
}

function isOverdue(customer) {
  if (customer.status !== 'Teklif Gönderildi') return false;
  const d = getDate(customer.createdAt);
  if (!d) return false;
  return d < new Date(Date.now() - 3 * 24 * 60 * 60 * 1000);
}

function daysSince(customer) {
  const d = getDate(customer.createdAt);
  if (!d) return 0;
  return Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60 * 24));
}

function BorusanCRM() {
  const [customers, setCustomers] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [loading, setLoading] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const [showEmailSettings, setShowEmailSettings] = useState(false);
  const [notifEnabled, setNotifEnabled] = useState(false);

  const [emailSettings, setEmailSettings] = useState({
    recipientEmail: localStorage.getItem('borusan_email') || '',
    serviceId: localStorage.getItem('borusan_emailjs_service') || '',
    templateId: localStorage.getItem('borusan_emailjs_template') || '',
    publicKey: localStorage.getItem('borusan_emailjs_public') || '',
    autoSend: localStorage.getItem('borusan_auto_email') === 'true',
    lastSent: localStorage.getItem('borusan_last_email') || null,
  });

  const [sortConfig, setSortConfig] = useState({ key: null, dir: 'asc' });
  const [filters, setFilters] = useState({
    name: '', contact: '', car: '',
    dateFrom: '', dateTo: '', status: 'all',
    priceMin: '', priceMax: '', dbsMin: '', dbsMax: ''
  });

  const emptyForm = { name:'', phone:'', email:'', carModel:'', status:'Teklif Gönderildi', price:'', dbsAmount:'', notes:'' };
  const [formData, setFormData] = useState(emptyForm);

  const db = window.firebaseDb;
  const { collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp, query, orderBy } = window.firebaseModules;

  useEffect(() => {
    if (!db) return;
    setSyncing(true);
    const q = query(collection(db, 'customers'), orderBy('createdAt', 'desc'));
    const unsub = onSnapshot(q, snap => {
      setCustomers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      setSyncing(false);
    });
    return unsub;
  }, [db]);

  useEffect(() => {
    if ('Notification' in window && Notification.permission !== 'denied') {
      Notification.requestPermission().then(p => setNotifEnabled(p === 'granted'));
    }
  }, []);

  useEffect(() => {
    if (emailSettings.publicKey) emailjs.init(emailSettings.publicKey);
  }, [emailSettings.publicKey]);

  // Auto email check
  useEffect(() => {
    if (!emailSettings.autoSend || !emailSettings.recipientEmail || customers.length === 0) return;
    const interval = setInterval(() => {
      const overdue = customers.filter(isOverdue);
      if (overdue.length === 0) return;
      const last = emailSettings.lastSent ? new Date(emailSettings.lastSent) : null;
      if (!last || last.toDateString() !== new Date().toDateString()) {
        sendEmail(overdue, false);
      }
    }, 60000);
    return () => clearInterval(interval);
  }, [customers, emailSettings]);

  const saveEmailSettings = (s) => {
    setEmailSettings(s);
    localStorage.setItem('borusan_email', s.recipientEmail);
    localStorage.setItem('borusan_emailjs_service', s.serviceId);
    localStorage.setItem('borusan_emailjs_template', s.templateId);
    localStorage.setItem('borusan_emailjs_public', s.publicKey);
    localStorage.setItem('borusan_auto_email', s.autoSend.toString());
  };

  const sendEmail = async (list, isTest = false) => {
    const { serviceId, templateId, publicKey, recipientEmail } = emailSettings;
    if (!serviceId || !templateId || !publicKey || !recipientEmail) {
      alert('⚠️ E-posta ayarlarını tamamlayın!');
      return false;
    }
    try {
      const customerList = list.map((c, i) => {
        const d = getDate(c.createdAt);
        const days = d ? Math.floor((Date.now() - d.getTime()) / 86400000) : '?';
        return `${i + 1}. ${c.name}\n   📞 ${c.phone}\n   🚗 ${c.carModel}\n   ⏱️ ${days} gün\n   💰 ${c.price || '-'} ₺\n`;
      }).join('\n');

      await emailjs.send(serviceId, templateId, {
        to_email: recipientEmail,
        customer_count: list.length,
        customer_list: customerList,
        date: new Date().toLocaleDateString('tr-TR'),
        time: new Date().toLocaleTimeString('tr-TR'),
        is_test: isTest ? 'TEST — ' : '',
      });

      if (!isTest) {
        const s = { ...emailSettings, lastSent: new Date().toISOString() };
        saveEmailSettings(s);
        localStorage.setItem('borusan_last_email', s.lastSent);
      }
      return true;
    } catch (e) {
      alert('❌ E-posta gönderilemedi: ' + (e.text || e.message));
      return false;
    }
  };

  const handleSubmit = async () => {
    if (!formData.name || !formData.phone || !formData.carModel) {
      alert('Müşteri Adı, Telefon ve Araç Modeli zorunludur!');
      return;
    }
    setLoading(true);
    try {
      if (editingId) {
        await updateDoc(doc(db, 'customers', editingId), { ...formData, updatedAt: serverTimestamp() });
      } else {
        await addDoc(collection(db, 'customers'), { ...formData, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      }
      setFormData(emptyForm); setEditingId(null); setShowForm(false);
    } catch (e) { alert('Hata: ' + e.message); }
    setLoading(false);
  };

  const handleEdit = (c) => {
    setFormData({ name: c.name||'', phone: c.phone||'', email: c.email||'', carModel: c.carModel||'', status: c.status||'Teklif Gönderildi', price: c.price||'', dbsAmount: c.dbsAmount||'', notes: c.notes||'' });
    setEditingId(c.id); setShowForm(true);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const handleDelete = async (id) => {
    if (!window.confirm('Bu müşteriyi silmek istediğinizden emin misiniz?')) return;
    setLoading(true);
    try { await deleteDoc(doc(db, 'customers', id)); } catch (e) { alert('Hata: ' + e.message); }
    setLoading(false);
  };

  const handleExcelUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setLoading(true);
    try {
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data);
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      let count = 0;
      for (const r of rows) {
        if (r['Müşteri Adı'] && r['Telefon'] && r['Araç']) {
          await addDoc(collection(db, 'customers'), {
            name: r['Müşteri Adı']||'', phone: String(r['Telefon']||''),
            email: r['E-posta']||'', carModel: r['Araç']||'',
            status: r['Durum']||'Teklif Gönderildi',
            price: String(r['Fiyat']||''), dbsAmount: String(r['DBS']||''),
            notes: r['Notlar']||'', createdAt: serverTimestamp(), updatedAt: serverTimestamp()
          });
          count++;
        }
      }
      alert(`✅ ${count} müşteri eklendi!`);
      e.target.value = '';
    } catch (e) { alert('Hata: ' + e.message); }
    setLoading(false);
  };

  const downloadTemplate = () => {
    const ws = XLSX.utils.json_to_sheet([{ 'Müşteri Adı':'Ahmet Yılmaz','Telefon':'05551234567','E-posta':'ahmet@email.com','Araç':'BMW 5 Serisi','Durum':'Teklif Gönderildi','Fiyat':'50000','DBS':'5000','Notlar':'Örnek not' }]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Müşteriler');
    XLSX.writeFile(wb, 'borusan-sablon.xlsx');
  };

  const exportExcel = () => {
    const data = processed.map((c, i) => {
      const d = getDate(c.createdAt);
      return { 'Sıra': i+1, 'Müşteri': c.name, 'Telefon': c.phone, 'E-posta': c.email||'-', 'Araç': c.carModel, 'Tarih': d?d.toLocaleDateString('tr-TR'):'', 'Durum': c.status, 'Fiyat': c.price||'-', 'DBS': c.dbsAmount||'-', 'Notlar': c.notes||'-' };
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Müşteriler');
    XLSX.writeFile(wb, `borusan-${new Date().toLocaleDateString('tr-TR').replace(/\./g,'-')}.xlsx`);
  };

  // Filter
  const filtered = customers.filter(c => {
    if (filters.name && !c.name?.toLowerCase().includes(filters.name.toLowerCase())) return false;
    if (filters.contact && !c.phone?.includes(filters.contact) && !c.email?.toLowerCase().includes(filters.contact.toLowerCase())) return false;
    if (filters.car && !c.carModel?.toLowerCase().includes(filters.car.toLowerCase())) return false;
    if (filters.status !== 'all' && c.status !== filters.status) return false;
    const d = getDate(c.createdAt);
    if (d) {
      const dn = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      if (filters.dateFrom && dn < new Date(filters.dateFrom)) return false;
      if (filters.dateTo && dn > new Date(filters.dateTo)) return false;
    }
    if (filters.priceMin || filters.priceMax) {
      const p = parseFloat(c.price?.replace(/[^0-9.-]/g,'')) || 0;
      if (filters.priceMin && p < +filters.priceMin) return false;
      if (filters.priceMax && p > +filters.priceMax) return false;
    }
    if (filters.dbsMin || filters.dbsMax) {
      const d2 = parseFloat(c.dbsAmount?.replace(/[^0-9.-]/g,'')) || 0;
      if (filters.dbsMin && d2 < +filters.dbsMin) return false;
      if (filters.dbsMax && d2 > +filters.dbsMax) return false;
    }
    return true;
  });

  // Sort
  const handleSort = (key) => setSortConfig(s => ({ key, dir: s.key === key && s.dir === 'asc' ? 'desc' : 'asc' }));

  const processed = [...filtered].sort((a, b) => {
    if (!sortConfig.key) return 0;
    let av, bv;
    if (sortConfig.key === 'name') { av = a.name?.toLowerCase()||''; bv = b.name?.toLowerCase()||''; }
    else if (sortConfig.key === 'car') { av = a.carModel?.toLowerCase()||''; bv = b.carModel?.toLowerCase()||''; }
    else if (sortConfig.key === 'date') { av = getDate(a.createdAt)?.getTime()||0; bv = getDate(b.createdAt)?.getTime()||0; }
    else if (sortConfig.key === 'status') { av = a.status||''; bv = b.status||''; }
    else if (sortConfig.key === 'price') { av = parseFloat(a.price)||0; bv = parseFloat(b.price)||0; }
    else if (sortConfig.key === 'dbs') { av = parseFloat(a.dbsAmount)||0; bv = parseFloat(b.dbsAmount)||0; }
    else return 0;
    if (av < bv) return sortConfig.dir === 'asc' ? -1 : 1;
    if (av > bv) return sortConfig.dir === 'asc' ? 1 : -1;
    return 0;
  });

  const clearFilters = () => setFilters({ name:'', contact:'', car:'', dateFrom:'', dateTo:'', status:'all', priceMin:'', priceMax:'', dbsMin:'', dbsMax:'' });
  const activeFilters = Object.entries(filters).filter(([k, v]) => k === 'status' ? v !== 'all' : v !== '').length;

  const overdueList = customers.filter(isOverdue);

  const SortTh = ({ col, label }) => (
    <button className={`sort-btn ${sortConfig.key === col ? 'active' : ''}`} onClick={() => handleSort(col)}>
      {label}
      <span className="sort-arrow">
        {sortConfig.key === col ? (sortConfig.dir === 'asc' ? '▲' : '▼') : '⇅'}
      </span>
    </button>
  );

  const fmt = (v) => v ? parseFloat(v).toLocaleString('tr-TR') + ' ₺' : '—';

  return (
    <div style={{ padding: '16px', maxWidth: '1600px', margin: '0 auto' }}>

      {/* ═══ HEADER ═══ */}
      <div style={{ marginBottom: '24px' }}>
        {/* Logo Bar */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '20px', flexWrap: 'wrap', gap: '12px' }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: '16px' }}>
            <h1 className="display-font" style={{ fontSize: 'clamp(28px, 5vw, 48px)', color: 'var(--gold)', lineHeight: 1 }}>
              BORUSAN
            </h1>
            <span className="display-font" style={{ fontSize: 'clamp(16px, 3vw, 24px)', color: 'var(--text-dim)', letterSpacing: '0.2em' }}>
              OTOMOTİV
            </span>
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginLeft: '8px' }}>
              <span className="dot-live"></span>
              <span className="mono" style={{ fontSize: '10px', color: 'var(--text-dim)' }}>
                {syncing ? 'SYNCING...' : 'LIVE'}
              </span>
            </div>
          </div>

          {/* Action Buttons */}
          <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
            <input type="file" id="xl-upload" accept=".xlsx,.xls" onChange={handleExcelUpload} style={{ display: 'none' }} />
            <button className="btn-ghost" onClick={downloadTemplate}>
              <Icon path={ICONS.download} /> <span className="hide-mobile">Şablon</span>
            </button>
            <button className="btn-ghost" onClick={() => document.getElementById('xl-upload').click()} disabled={loading}>
              <Icon path={ICONS.excel} /> <span className="hide-mobile">Excel Yükle</span>
            </button>
            <button className="btn-ghost" onClick={exportExcel} disabled={processed.length === 0}>
              <Icon path={ICONS.download} /> <span className="hide-mobile">Dışa Aktar</span>
            </button>
            <button className="btn-ghost" onClick={() => setShowEmailSettings(!showEmailSettings)}>
              <Icon path={ICONS.settings} />
            </button>
            <button className="btn-gold" onClick={() => { setShowForm(!showForm); setEditingId(null); setFormData(emptyForm); }}>
              <Icon path={ICONS.plus} /> YENİ MÜŞTERİ
            </button>
          </div>
        </div>

        {/* Stat Cards */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '12px' }}>
          {[
            { status: 'Teklif Gönderildi', color: '#a78bfa' },
            { status: 'Finansal Değerlendirme', color: '#fbbf24' },
            { status: 'Sözleşme/DBS Bekleniyor', color: '#fb923c' },
            { status: 'Teslimat', color: '#4ade80' },
          ].map(({ status, color }) => {
            const count = customers.filter(c => c.status === status).length;
            const pct = customers.length ? Math.round(count / customers.length * 100) : 0;
            return (
              <div key={status} className="stat-card" onClick={() => setFilters({ ...filters, status })}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '12px' }}>
                  <div style={{ width: '8px', height: '8px', borderRadius: '50%', background: color, marginTop: '4px' }}></div>
                  <span className="mono" style={{ fontSize: '10px', color: 'var(--text-dim)' }}>{pct}%</span>
                </div>
                <div className="display-font" style={{ fontSize: '36px', color: color, lineHeight: 1 }}>{count}</div>
                <div style={{ fontSize: '12px', color: 'var(--text-dim)', marginTop: '4px', fontWeight: 600, letterSpacing: '0.05em' }}>{status}</div>
                {/* Progress bar */}
                <div style={{ marginTop: '12px', height: '2px', background: 'rgba(255,255,255,0.05)', borderRadius: '1px' }}>
                  <div style={{ height: '100%', width: pct + '%', background: color, borderRadius: '1px', transition: 'width 0.5s ease' }}></div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ═══ OVERDUE WARNING ═══ */}
      {overdueList.length > 0 && (
        <div className="warning-banner" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '16px', flexWrap: 'wrap', gap: '12px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
            <Icon path={ICONS.bell} size={20} />
            <div>
              <div style={{ fontWeight: 700, fontSize: '15px', color: '#fca5a5' }}>
                {overdueList.length} müşteri 3+ gün bekleniyor
              </div>
              <div style={{ fontSize: '12px', color: 'var(--text-dim)', marginTop: '2px' }}>
                {overdueList.slice(0,3).map(c => c.name).join(', ')}{overdueList.length > 3 ? '...' : ''}
              </div>
            </div>
          </div>
          <div style={{ display: 'flex', gap: '8px' }}>
            <button className="btn-ghost" style={{ borderColor: 'rgba(239,68,68,0.3)', color: '#f87171' }}
              onClick={async () => { const ok = await sendEmail(overdueList, false); if (ok) alert('✅ E-posta gönderildi!'); }}>
              <Icon path={ICONS.mail} /> E-posta Gönder
            </button>
            <button className="btn-ghost" style={{ borderColor: 'rgba(239,68,68,0.3)', color: '#f87171' }}
              onClick={() => setFilters({ ...filters, status: 'Teklif Gönderildi' })}>
              Göster
            </button>
          </div>
        </div>
      )}

      {/* ═══ EMAIL SETTINGS ═══ */}
      {showEmailSettings && (
        <div className="panel animate-fade-up" style={{ padding: '24px', marginBottom: '16px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
            <span className="display-font" style={{ fontSize: '20px', color: 'var(--gold)' }}>E-POSTA AYARLARI</span>
            <button className="btn-ghost" onClick={() => setShowEmailSettings(false)}><Icon path={ICONS.close} /></button>
          </div>

          {/* Info */}
          <div style={{ background: 'rgba(201,168,76,0.06)', border: '1px solid var(--border)', padding: '16px', marginBottom: '20px', borderRadius: '2px' }}>
            <div className="mono" style={{ fontSize: '11px', color: 'var(--gold)', marginBottom: '8px' }}>KURULUM ADIMLARI</div>
            <ol style={{ paddingLeft: '16px', fontSize: '13px', color: 'var(--text-dim)', lineHeight: 2 }}>
              <li><a href="https://www.emailjs.com/" target="_blank" style={{ color: 'var(--gold)' }}>emailjs.com</a> → Ücretsiz hesap oluşturun</li>
              <li>Email Services → Gmail/Outlook bağlayın → <strong style={{ color: 'var(--text)' }}>Service ID</strong> kopyalayın</li>
              <li>Email Templates → Şablon oluşturun → <strong style={{ color: 'var(--text)' }}>Template ID</strong> kopyalayın</li>
              <li>Account → API Keys → <strong style={{ color: 'var(--text)' }}>Public Key</strong> kopyalayın</li>
            </ol>
            <div style={{ marginTop: '12px', background: 'rgba(0,0,0,0.3)', padding: '12px', borderRadius: '2px' }}>
              <div className="mono" style={{ fontSize: '10px', color: 'var(--text-dim)', marginBottom: '8px' }}>TEMPLATE İÇERİĞİ:</div>
              <pre className="mono" style={{ fontSize: '11px', color: 'var(--text)', whiteSpace: 'pre-wrap' }}>{`Konu: Borusan CRM - {{customer_count}} Müşteri Takip Bekliyor\n\n{{is_test}}{{customer_count}} müşteri bekliyor:\n\n{{customer_list}}\n\nTarih: {{date}} - {{time}}`}</pre>
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '16px' }}>
            {[
              { key: 'recipientEmail', label: 'E-POSTA ADRESİNİZ', placeholder: 'ornek@email.com', type: 'email' },
              { key: 'serviceId', label: 'SERVICE ID', placeholder: 'service_xxxxxxx' },
              { key: 'templateId', label: 'TEMPLATE ID', placeholder: 'template_xxxxxxx' },
              { key: 'publicKey', label: 'PUBLIC KEY', placeholder: 'xxxxxxxxxxxxxxxxxx' },
            ].map(({ key, label, placeholder, type }) => (
              <div key={key}>
                <div className="mono" style={{ fontSize: '10px', color: 'var(--gold)', marginBottom: '8px', letterSpacing: '0.1em' }}>{label}</div>
                <input className="crm-input" type={type || 'text'} value={emailSettings[key]}
                  onChange={e => setEmailSettings({ ...emailSettings, [key]: e.target.value })}
                  placeholder={placeholder} />
              </div>
            ))}

            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', gridColumn: '1/-1' }}>
              <input type="checkbox" id="autoSend" checked={emailSettings.autoSend}
                onChange={e => setEmailSettings({ ...emailSettings, autoSend: e.target.checked })}
                style={{ accentColor: 'var(--gold)', width: '16px', height: '16px' }} />
              <label htmlFor="autoSend" style={{ fontSize: '13px', fontWeight: 600, cursor: 'pointer' }}>
                Otomatik e-posta gönder (günde 1 kez)
              </label>
              {emailSettings.lastSent && (
                <span className="mono" style={{ fontSize: '10px', color: 'var(--text-dim)', marginLeft: 'auto' }}>
                  Son: {new Date(emailSettings.lastSent).toLocaleString('tr-TR')}
                </span>
              )}
            </div>

            <div style={{ gridColumn: '1/-1', display: 'flex', gap: '12px' }}>
              <button className="btn-gold" onClick={() => { saveEmailSettings(emailSettings); alert('✅ Kaydedildi!'); }}>
                Kaydet
              </button>
              <button className="btn-ghost" onClick={async () => {
                const testList = customers.filter(c => c.status === 'Teklif Gönderildi');
                if (!testList.length) { alert('⚠️ "Teklif Gönderildi" durumunda müşteri yok!'); return; }
                const ok = await sendEmail(testList, true);
                if (ok) alert(`✅ Test e-postası gönderildi! (${testList.length} müşteri)`);
              }}>
                <Icon path={ICONS.mail} /> Test Gönder
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ═══ FORM ═══ */}
      {showForm && (
        <div className="panel animate-fade-up" style={{ padding: '24px', marginBottom: '16px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
            <span className="display-font" style={{ fontSize: '20px', color: 'var(--gold)' }}>
              {editingId ? 'MÜŞTERİ DÜZENLE' : 'YENİ MÜŞTERİ EKLE'}
            </span>
            <button className="btn-ghost" onClick={() => { setShowForm(false); setEditingId(null); setFormData(emptyForm); }}>
              <Icon path={ICONS.close} />
            </button>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '16px' }}>
            {[
              { key: 'name', label: 'MÜŞTERİ ADI *', placeholder: 'Ad Soyad' },
              { key: 'phone', label: 'TELEFON *', placeholder: '0555 123 45 67', type: 'tel' },
              { key: 'email', label: 'E-POSTA', placeholder: 'musteri@email.com', type: 'email' },
              { key: 'carModel', label: 'ARAÇ MODELİ *', placeholder: 'BMW 5 Serisi' },
              { key: 'price', label: 'FİYAT (₺)', placeholder: '50000' },
              { key: 'dbsAmount', label: 'DBS MİKTARI (₺)', placeholder: '5000' },
            ].map(({ key, label, placeholder, type }) => (
              <div key={key}>
                <div className="mono" style={{ fontSize: '10px', color: 'var(--gold)', marginBottom: '8px', letterSpacing: '0.1em' }}>{label}</div>
                <input className="crm-input" type={type || 'text'} value={formData[key]}
                  onChange={e => setFormData({ ...formData, [key]: e.target.value })}
                  placeholder={placeholder} />
              </div>
            ))}

            <div>
              <div className="mono" style={{ fontSize: '10px', color: 'var(--gold)', marginBottom: '8px', letterSpacing: '0.1em' }}>DURUM</div>
              <select className="crm-input" value={formData.status} onChange={e => setFormData({ ...formData, status: e.target.value })}>
                {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>

            <div style={{ gridColumn: '1/-1' }}>
              <div className="mono" style={{ fontSize: '10px', color: 'var(--gold)', marginBottom: '8px', letterSpacing: '0.1em' }}>NOTLAR</div>
              <textarea className="crm-input" rows={3} value={formData.notes}
                onChange={e => setFormData({ ...formData, notes: e.target.value })}
                placeholder="Notlar..." style={{ resize: 'vertical' }} />
            </div>

            <div style={{ gridColumn: '1/-1', display: 'flex', gap: '12px' }}>
              <button className="btn-gold" onClick={handleSubmit} disabled={loading}>
                {loading ? 'KAYDEDİLİYOR...' : (editingId ? '✓ GÜNCELLE' : '+ KAYDET')}
              </button>
              <button className="btn-ghost" onClick={() => { setShowForm(false); setEditingId(null); setFormData(emptyForm); }}>
                İPTAL
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ═══ FILTER BAR ═══ */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px', padding: '0 4px' }}>
        <span className="mono" style={{ fontSize: '11px', color: 'var(--text-dim)' }}>
          {processed.length === customers.length
            ? `${customers.length} KAYIT`
            : `${processed.length} / ${customers.length} KAYIT`}
          {activeFilters > 0 && <span style={{ color: 'var(--gold)', marginLeft: '8px' }}>• {activeFilters} FİLTRE</span>}
        </span>
        {activeFilters > 0 && (
          <button className="btn-ghost" onClick={clearFilters} style={{ fontSize: '11px', padding: '6px 12px' }}>
            <Icon path={ICONS.close} size={12} /> Temizle
          </button>
        )}
      </div>

      {/* ═══ TABLE ═══ */}
      <div className="panel" style={{ overflow: 'hidden' }}>
        <div style={{ overflowX: 'auto' }}>
          <table className="crm-table">
            <thead>
              <tr>
                <th style={{ width: '48px' }}>
                  <span className="mono" style={{ fontSize: '10px', letterSpacing: '0.1em' }}>#</span>
                </th>
                <th>
                  <SortTh col="name" label="MÜŞTERİ" />
                  <input className="th-filter" placeholder="İsim..." value={filters.name}
                    onChange={e => setFilters({ ...filters, name: e.target.value })} />
                </th>
                <th className="hide-mobile">
                  İLETİŞİM
                  <input className="th-filter" placeholder="Tel / E-posta..." value={filters.contact}
                    onChange={e => setFilters({ ...filters, contact: e.target.value })} />
                </th>
                <th className="hide-mobile">
                  <SortTh col="car" label="ARAÇ" />
                  <input className="th-filter" placeholder="Model..." value={filters.car}
                    onChange={e => setFilters({ ...filters, car: e.target.value })} />
                </th>
                <th className="hide-mobile">
                  <SortTh col="date" label="TARİH" />
                  <div style={{ display: 'flex', gap: '4px', marginTop: '8px' }}>
                    <input className="th-filter" type="date" style={{ margin: 0 }} value={filters.dateFrom}
                      onChange={e => setFilters({ ...filters, dateFrom: e.target.value })} />
                    <input className="th-filter" type="date" style={{ margin: 0 }} value={filters.dateTo}
                      onChange={e => setFilters({ ...filters, dateTo: e.target.value })} />
                  </div>
                </th>
                <th>
                  <SortTh col="status" label="DURUM" />
                  <select className="th-filter" value={filters.status}
                    onChange={e => setFilters({ ...filters, status: e.target.value })}>
                    <option value="all">Tümü</option>
                    {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </th>
                <th className="hide-mobile">
                  <SortTh col="price" label="FİYAT" />
                  <div style={{ display: 'flex', gap: '4px', marginTop: '8px' }}>
                    <input className="th-filter" type="number" placeholder="Min" style={{ margin: 0 }}
                      value={filters.priceMin} onChange={e => setFilters({ ...filters, priceMin: e.target.value })} />
                    <input className="th-filter" type="number" placeholder="Max" style={{ margin: 0 }}
                      value={filters.priceMax} onChange={e => setFilters({ ...filters, priceMax: e.target.value })} />
                  </div>
                </th>
                <th className="hide-mobile">
                  <SortTh col="dbs" label="DBS" />
                  <div style={{ display: 'flex', gap: '4px', marginTop: '8px' }}>
                    <input className="th-filter" type="number" placeholder="Min" style={{ margin: 0 }}
                      value={filters.dbsMin} onChange={e => setFilters({ ...filters, dbsMin: e.target.value })} />
                    <input className="th-filter" type="number" placeholder="Max" style={{ margin: 0 }}
                      value={filters.dbsMax} onChange={e => setFilters({ ...filters, dbsMax: e.target.value })} />
                  </div>
                </th>
                <th style={{ width: '80px' }}>—</th>
              </tr>
            </thead>
            <tbody>
              {processed.length === 0 ? (
                <tr>
                  <td colSpan="9" style={{ textAlign: 'center', padding: '60px', color: 'var(--text-dim)' }}>
                    <div className="display-font" style={{ fontSize: '32px', marginBottom: '8px', color: 'rgba(201,168,76,0.2)' }}>NO DATA</div>
                    <div className="mono" style={{ fontSize: '12px' }}>
                      {syncing ? 'BAĞLANIYOR...' : activeFilters > 0 ? 'FİLTREYE UYAN KAYIT YOK' : 'HENÜZ MÜŞTERİ EKLENMEDİ'}
                    </div>
                  </td>
                </tr>
              ) : processed.map((c, i) => {
                const d = getDate(c.createdAt);
                const overdue = isOverdue(c);
                const days = daysSince(c);
                return (
                  <tr key={c.id} className={overdue ? 'overdue' : ''}>
                    <td>
                      <span className={`row-index ${overdue ? 'overdue' : ''}`}>{i + 1}</span>
                    </td>
                    <td>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap' }}>
                        <span style={{ fontWeight: 700, fontSize: '15px' }}>{c.name}</span>
                        {overdue && <span className="badge-overdue">⚠ {days}G</span>}
                      </div>
                      {c.notes && (
                        <div className="mono" style={{ fontSize: '10px', color: 'var(--text-dim)', marginTop: '4px', maxWidth: '200px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                          {c.notes}
                        </div>
                      )}
                    </td>
                    <td className="hide-mobile">
                      <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '4px' }}>
                        <Icon path={ICONS.phone} size={12} />
                        <span className="mono" style={{ fontSize: '12px' }}>{c.phone}</span>
                      </div>
                      {c.email && (
                        <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                          <Icon path={ICONS.mail} size={12} />
                          <span className="mono" style={{ fontSize: '11px', color: 'var(--text-dim)' }}>{c.email}</span>
                        </div>
                      )}
                    </td>
                    <td className="hide-mobile">
                      <span style={{ fontWeight: 600 }}>{c.carModel}</span>
                    </td>
                    <td className="hide-mobile">
                      {d ? (
                        <div>
                          <div className="mono" style={{ fontSize: '12px' }}>{d.toLocaleDateString('tr-TR')}</div>
                          <div className="mono" style={{ fontSize: '10px', color: 'var(--text-dim)' }}>{d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })}</div>
                        </div>
                      ) : <span style={{ color: 'var(--text-dim)' }}>—</span>}
                    </td>
                    <td>
                      <span className={`badge ${STATUS_MAP[c.status]?.badge || ''}`}>
                        <span style={{ width: '5px', height: '5px', borderRadius: '50%', background: STATUS_MAP[c.status]?.dot, display: 'inline-block', marginRight: '6px' }}></span>
                        {c.status}
                      </span>
                    </td>
                    <td className="hide-mobile">
                      <span style={{ color: '#4ade80', fontWeight: 700 }}>{fmt(c.price)}</span>
                    </td>
                    <td className="hide-mobile">
                      <span style={{ color: 'var(--gold)', fontWeight: 700 }}>{fmt(c.dbsAmount)}</span>
                    </td>
                    <td>
                      <div style={{ display: 'flex', gap: '4px' }}>
                        <button className="btn-edit" onClick={() => handleEdit(c)} title="Düzenle">
                          <Icon path={ICONS.edit} size={14} />
                        </button>
                        <button className="btn-danger" onClick={() => handleDelete(c.id)} title="Sil">
                          <Icon path={ICONS.trash} size={14} />
                        </button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {/* Table Footer */}
        <div style={{ padding: '12px 16px', borderTop: '1px solid rgba(255,255,255,0.04)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span className="mono" style={{ fontSize: '10px', color: 'var(--text-dim)' }}>
            BORUSAN OTOMOTİV CRM — REAL TIME SYNC
          </span>
          <span className="mono" style={{ fontSize: '10px', color: 'var(--text-dim)' }}>
            TOPLAM: {customers.length} KAYIT
          </span>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BorusanCRM />);
</script>
</body>
</html>
